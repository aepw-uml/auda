[project]
name = "auda"
version = "1.0.0"
description = "AUDA (AEPW x UMass Lowell Data Analaysis) terminal application."
authors = [{ name = "James Chen", email = "zhuojian_chen@student.uml.edu" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy (>=2.3.5,<3.0.0)", 
    "matplotlib (>=3.10.8,<4.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)", 
    "psycopg2-binary (>=2.9.11,<3.0.0)", 
    "psycopg (>=3.3.2,<4.0.0)", 
    "typer (>=0.20.0,<0.21.0)", 
    "python-dotenv (>=1.2.1,<2.0.0)",
    "sqlalchemy (>=2.0.45,<3.0.0)",
    "tabulate (>=0.9.0,<0.10.0)", 
    "pydantic (>=2.12.5,<3.0.0)", 
    "diskcache (>=5.6.3,<6.0.0)", 
    "seaborn (>=0.13.2,<0.14.0)", 
    "torch (>=2.9.1,<3.0.0)", 
    "statsmodels (>=0.14.6,<0.15.0)"
]

[build-system]
requires = ["poetry-core>=2.1.3,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
